name: EVEZ Station Deploy (Self-Hosted)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy action'
        required: false
        default: 'deploy'
        type: choice
        options: [deploy, secrets-only, health-check]

jobs:
  deploy:
    name: Deploy EVEZ Station
    runs-on: [self-hosted, evez]
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install --production
        
      - name: Install flyctl
        run: |
          if ! command -v fly &>/dev/null; then
            curl -L https://fly.io/install.sh | sh
            echo "$HOME/.fly/bin" >> $GITHUB_PATH
          fi
          
      - name: Set Fly secrets (if FLY_API_TOKEN set)
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly secrets set \
            GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            CEREBRAS_API_KEY="${{ secrets.CEREBRAS_API_KEY }}" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            AWS_ENDPOINT_URL_S3="${{ secrets.AWS_ENDPOINT_URL_S3 }}" \
            AWS_REGION="${{ secrets.AWS_REGION }}" \
            BUCKET_NAME="${{ secrets.BUCKET_NAME }}" \
            --app evezstation 2>/dev/null || echo "Could not set secrets (app may not exist yet)"
            
      - name: Deploy to Fly.io (if FLY_API_TOKEN set)  
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly deploy --app evezstation --strategy=rolling --wait-timeout=300 || \
          fly launch --copy-config --name evezstation --yes --no-deploy && fly deploy
          
      - name: Health check
        run: |
          echo "Server running locally: $(curl -s http://localhost:3000/api/health | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["status"])')"
          echo "Server live at: https://heroism-negligee-zoom.ngrok-free.dev/api/health"
          curl -s https://heroism-negligee-zoom.ngrok-free.dev/api/health || echo "ngrok tunnel offline"
